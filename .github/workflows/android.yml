          java -cp build/geometry-tests ClosedSketchExtrusionTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/StoredMeshTriangleMap.java tests/StoredMeshTriangleMapTest.java
