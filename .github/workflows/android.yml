name: APK Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Comprobar integridad del proyecto
        run: bash scripts/verify-project.sh
      - name: Probar geometría sin Android
        run: |
          mkdir -p build/geometry-tests
          javac -d build/geometry-tests app/src/main/java/es/josxtm/mycad/GeometryMath.java app/src/main/java/es/josxtm/mycad/BoxBoolean.java tests/GeometryMathTest.java tests/BoxBooleanTest.java
          java -cp build/geometry-tests GeometryMathTest
          java -cp build/geometry-tests BoxBooleanTest
      - name: Compilar, ejecutar pruebas y comprobar Lint
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Verificar APK y nombre de versión
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" app/build.gradle | head -n 1)
          test -n "$VERSION"
          APK="app/build/outputs/apk/debug/myCad${VERSION}.apk"
          test -s "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
      - name: Publicar APK solo tras superar verificaciones
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: myCad${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
