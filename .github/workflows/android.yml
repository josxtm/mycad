          java -cp build/geometry-tests RigidTransformTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/CylinderSurface.java app/src/main/java/es/josxtm/mycad/cad/CircularThroughHole.java app/src/main/java/es/josxtm/mycad/cad/BlindCircularHole.java app/src/main/java/es/josxtm/mycad/cad/OrientedThroughHole.java app/src/main/java/es/josxtm/mycad/cad/DrilledBoxRecipe.java tests/CurvedGeometryTest.java
          java -cp build/geometry-tests CurvedGeometryTest
          javac -cp build/geometry-tests -d build/geometry-tests tests/OrientedThroughHoleTest.java
          java -cp build/geometry-tests OrientedThroughHoleTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/TriangleMeshHealth.java tests/TriangleMeshHealthTest.java
          java -cp build/geometry-tests TriangleMeshHealthTest
