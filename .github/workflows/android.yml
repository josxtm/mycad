name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Detectar versión y comprobar APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name 'myCad*.apk' -print -quit)
          test -n "$APK"
          VERSION=$(sed -nE "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" app/build.gradle | head -n 1)
          test -n "$VERSION"
          test "$(basename "$APK")" = "myCad${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: myCad${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
