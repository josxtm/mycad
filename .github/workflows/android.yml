name: MyCAD · Verificación continua y APK por hitos
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      generar_apk:
        description: "Generar APK de un hito importante"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar informes
        run: mkdir -p reports
      - name: Comprobar integridad del proyecto
        id: integrity
        run: set -o pipefail; bash scripts/verify-project.sh 2>&1 | tee reports/integridad.log
        shell: bash
      - name: Probar geometría sin Android
        id: geometry
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geometry-tests
          {
          javac -d build/geometry-tests app/src/main/java/es/josxtm/mycad/GeometryMath.java app/src/main/java/es/josxtm/mycad/BoxBoolean.java app/src/main/java/es/josxtm/mycad/BoxBooleanMesh.java tests/GeometryMathTest.java tests/BoxBooleanTest.java tests/BoxBooleanMeshTest.java
          java -cp build/geometry-tests GeometryMathTest
          java -cp build/geometry-tests BoxBooleanTest
          java -cp build/geometry-tests BoxBooleanMeshTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/MultiBoxUnion.java tests/MultiBoxUnionTest.java
          java -cp build/geometry-tests MultiBoxUnionTest
          javac -cp build/geometry-tests -d build/geometry-tests tests/MultiBoxOperationsTest.java
          java -cp build/geometry-tests MultiBoxOperationsTest
          javac -cp build/geometry-tests -d build/geometry-tests tests/ChainBooleanTest.java
          java -cp build/geometry-tests ChainBooleanTest
          javac -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/CadKernel.java app/src/main/java/es/josxtm/mycad/cad/PrimitiveKernel.java tests/CadKernelTest.java
          java -cp build/geometry-tests CadKernelTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/CadDocument.java tests/CadDocumentTest.java
          java -cp build/geometry-tests CadDocumentTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/PlaneExtrusion.java tests/PlaneExtrusionTest.java
          java -cp build/geometry-tests PlaneExtrusionTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/ParametricSketchDocument.java tests/ParametricSketchDocumentTest.java
          java -cp build/geometry-tests ParametricSketchDocumentTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/SketchDxfIO.java tests/SketchDxfIOTest.java
          java -cp build/geometry-tests SketchDxfIOTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/SketchEditValidator.java tests/SketchEditValidatorTest.java
          java -cp build/geometry-tests SketchEditValidatorTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/LinkedSketchSolidPlan.java app/src/main/java/es/josxtm/mycad/cad/LinkedSketchAudit.java tests/LinkedSketchSolidPlanTest.java tests/LinkedSketchAuditTest.java
          java -cp build/geometry-tests LinkedSketchSolidPlanTest
          java -cp build/geometry-tests LinkedSketchAuditTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/SketchDeletionPlan.java tests/SketchDeletionPlanTest.java
          java -cp build/geometry-tests SketchDeletionPlanTest
