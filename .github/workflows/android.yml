          java -cp build/geometry-tests ConvexPrismBRepHullUnionTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/OrthogonalPrismBRepUnion.java app/src/main/java/es/josxtm/mycad/cad/OrthogonalPolygonBRepBoolean.java app/src/main/java/es/josxtm/mycad/cad/OrthogonalGridHoleBRep.java
