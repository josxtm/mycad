          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/PolygonPrismFacePicker.java tests/PolygonPrismFacePickerTest.java
          java -cp build/geometry-tests PolygonPrismFacePickerTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/PolygonPrismSideOffset.java tests/PolygonPrismSideOffsetTest.java
          java -cp build/geometry-tests PolygonPrismSideOffsetTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/ConvexPrismBRepIntersection.java tests/ConvexPrismBRepIntersectionTest.java
          java -cp build/geometry-tests ConvexPrismBRepIntersectionTest
          javac -cp build/geometry-tests -d build/geometry-tests tests/ConvexPrismBRepExtendedTest.java
          java -cp build/geometry-tests ConvexPrismBRepExtendedTest
          javac -cp build/geometry-tests -d build/geometry-tests tests/ConvexPrismBRepBoundaryTest.java
          java -cp build/geometry-tests ConvexPrismBRepBoundaryTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/ConvexPrismBRepNestedUnion.java tests/ConvexPrismBRepNestedUnionTest.java
          java -cp build/geometry-tests ConvexPrismBRepNestedUnionTest
