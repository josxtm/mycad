          java -cp build/geometry-tests LoopExtrusionFeatureTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/PolygonPrismBRep.java tests/PolygonPrismBRepTest.java
