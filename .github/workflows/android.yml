          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/VariableHeightOrthogonalMesh.java tests/VariableHeightOrthogonalMeshTest.java
          java -cp build/geometry-tests VariableHeightOrthogonalMeshTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/VariableHeightOrthogonalBRep.java tests/VariableHeightOrthogonalBRepTest.java
          java -cp build/geometry-tests VariableHeightOrthogonalBRepTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/SteppedCoplanarFaceGroups.java app/src/main/java/es/josxtm/mycad/cad/SteppedCoplanarPatchTopology.java tests/SteppedCoplanarFaceGroupsTest.java
          java -cp build/geometry-tests SteppedCoplanarFaceGroupsTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/SteppedPatchTrianglePicker.java tests/SteppedPatchTrianglePickerTest.java
          java -cp build/geometry-tests SteppedPatchTrianglePickerTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/SteppedPatchRayPicker.java tests/SteppedPatchRayPickerTest.java
          java -cp build/geometry-tests SteppedPatchRayPickerTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/SteppedSceneRayPicker.java tests/SteppedSceneRayPickerTest.java
          java -cp build/geometry-tests SteppedSceneRayPickerTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/SteppedViewportRayPicker.java tests/SteppedViewportRayPickerTest.java
          java -cp build/geometry-tests SteppedViewportRayPickerTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/LinkedConvexIntersection.java tests/LinkedConvexIntersectionTest.java tests/LinkedAnalyticBooleanTest.java
          java -cp build/geometry-tests LinkedConvexIntersectionTest
          java -cp build/geometry-tests LinkedAnalyticBooleanTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/LinkedBooleanRegenerationPlan.java tests/LinkedBooleanRegenerationPlanTest.java
          java -cp build/geometry-tests LinkedBooleanRegenerationPlanTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/OrthogonalPrismBRepUnion.java tests/OrthogonalPrismBRepUnionTest.java
          java -cp build/geometry-tests OrthogonalPrismBRepUnionTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/LinkedConvexIntersection.java tests/LinkedOrthogonalUnionTest.java
          java -cp build/geometry-tests LinkedOrthogonalUnionTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/OrthogonalPrismBRepUnion.java tests/OrthogonalPrismBRepDifferenceTest.java
          java -cp build/geometry-tests OrthogonalPrismBRepDifferenceTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/OrthogonalPolygonBRepBoolean.java tests/OrthogonalPolygonBRepBooleanTest.java
          java -cp build/geometry-tests OrthogonalPolygonBRepBooleanTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/LinkedConvexIntersection.java tests/LinkedConcaveBooleanTest.java
          java -cp build/geometry-tests LinkedConcaveBooleanTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/OrthogonalPolygonBRepBoolean.java tests/OrthogonalMultiShellBRepBooleanTest.java
          java -cp build/geometry-tests OrthogonalMultiShellBRepBooleanTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/LinkedConvexIntersection.java tests/LinkedMultiShellBooleanTest.java
          java -cp build/geometry-tests LinkedMultiShellBooleanTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/OrthogonalGridHoleBRep.java tests/OrthogonalGridHoleBRepTest.java
          java -cp build/geometry-tests OrthogonalGridHoleBRepTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/LinkedConvexIntersection.java tests/LinkedHoleBRepTest.java
          java -cp build/geometry-tests LinkedHoleBRepTest
          javac -cp build/geometry-tests -d build/geometry-tests tests/DxfContourExtrusionIntegrationTest.java
          java -cp build/geometry-tests DxfContourExtrusionIntegrationTest
          javac -cp build/geometry-tests -d build/geometry-tests tests/BlindCircularHoleTest.java
          java -cp build/geometry-tests BlindCircularHoleTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/CylinderBoxBoolean.java tests/CylinderBoxBooleanTest.java
          java -cp build/geometry-tests CylinderBoxBooleanTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/TransformedBody.java tests/TransformedBodyTest.java
          java -cp build/geometry-tests TransformedBodyTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/BoxSurface.java tests/BoxSurfaceTest.java
          java -cp build/geometry-tests BoxSurfaceTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/CadRayPicker.java tests/CadRayPickerTest.java
          java -cp build/geometry-tests CadRayPickerTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/BoxFaceSelection.java tests/BoxFaceSelectionTest.java
          java -cp build/geometry-tests BoxFaceSelectionTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/CadSceneFaceMap.java tests/CadSceneFaceMapTest.java
          java -cp build/geometry-tests CadSceneFaceMapTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/CadFaceReference.java tests/CadFaceReferenceTest.java
          java -cp build/geometry-tests CadFaceReferenceTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/PrimitiveTopologyMap.java tests/PrimitiveTopologyMapTest.java
          java -cp build/geometry-tests PrimitiveTopologyMapTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/PrimitiveEdges.java tests/PrimitiveEdgesTest.java
          java -cp build/geometry-tests PrimitiveEdgesTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/FaceResize.java tests/FaceResizeTest.java
          java -cp build/geometry-tests FaceResizeTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/RotatedFaceResize.java tests/RotatedFaceResizeTest.java
          java -cp build/geometry-tests RotatedFaceResizeTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/LinkedFaceResize.java tests/LinkedFaceResizeTest.java
          java -cp build/geometry-tests LinkedFaceResizeTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/FacePrismExtrusion.java tests/FacePrismExtrusionTest.java
          java -cp build/geometry-tests FacePrismExtrusionTest
          javac -cp build/geometry-tests -d build/geometry-tests tests/FaceExtrusionUnionTest.java
          java -cp build/geometry-tests FaceExtrusionUnionTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/FaceUnionRecipe.java tests/FaceUnionRecipeTest.java
          java -cp build/geometry-tests FaceUnionRecipeTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/FaceExtrusionChain.java tests/FaceExtrusionChainTest.java
          java -cp build/geometry-tests FaceExtrusionChainTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/ChainBooleanFeature.java tests/ChainBooleanFeatureTest.java
          java -cp build/geometry-tests ChainBooleanFeatureTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/ChainDependencyReport.java tests/StableFeatureDependenciesTest.java
          java -cp build/geometry-tests StableFeatureDependenciesTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/ChainBooleanRebuildCache.java tests/ChainBooleanRebuildCacheTest.java
          java -cp build/geometry-tests ChainBooleanRebuildCacheTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/ParametricFeatureGraph.java tests/ParametricFeatureGraphTest.java
          java -cp build/geometry-tests ParametricFeatureGraphTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/ChainTriangleMap.java tests/ChainTriangleMapTest.java
          java -cp build/geometry-tests ChainTriangleMapTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/CadIntegrationProbe.java tests/CadIntegrationProbeTest.java
          java -cp build/geometry-tests CadIntegrationProbeTest
          javac -cp build/geometry-tests -d build/geometry-tests app/src/main/java/es/josxtm/mycad/cad/DragPrecision.java app/src/main/java/es/josxtm/mycad/cad/BoxBRep.java app/src/main/java/es/josxtm/mycad/cad/SketchPushPullSession.java tests/SketchPushPullSessionTest.java
          java -cp build/geometry-tests SketchPushPullSessionTest
          } 2>&1 | tee reports/geometria.log
      # CI habitual valida Java, tests Android y Lint, SIN generar un APK.
      - name: Compilar código y comprobar pruebas y Lint (sin APK)
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace 2>&1 | tee reports/gradle.log
      # Solo en hitos: commit con prefijo exacto release: MyCAD o ejecución manual con generar_apk=true.
      - name: Generar APK únicamente en un hito
        id: assemble
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.generar_apk == true) ||
          (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: MyCAD '))
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee reports/apk-build.log
      - name: Verificar APK y nombre de versión
        id: apk
        if: steps.assemble.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" app/build.gradle | head -n 1)
          test -n "$VERSION"
          APK="app/build/outputs/apk/debug/myCad${VERSION}.apk"
          test -s "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
      - name: Crear informe de ejecución
        if: always()
        shell: bash
        env:
          INTEGRITY: ${{ steps.integrity.outcome }}
          GEOMETRY: ${{ steps.geometry.outcome }}
          BUILD: ${{ steps.build.outcome }}
          APK_CHECK: ${{ steps.apk.outcome }}
          APK_BUILD: ${{ steps.assemble.outcome }}
        run: |
          mkdir -p reports
          {
            echo "# MyCAD · Informe de compilación"
            echo
            echo "- Ejecución: $GITHUB_RUN_NUMBER"
            echo "- Commit: $GITHUB_SHA"
            echo "- Rama: $GITHUB_REF_NAME"
            echo "- Integridad: ${INTEGRITY:-unknown}"
            echo "- Pruebas geométricas: ${GEOMETRY:-unknown}"
            echo "- Gradle / Lint / tests: ${BUILD:-unknown}"
            echo "- Generación APK: ${APK_BUILD:-unknown}"
            echo "- Verificación APK: ${APK_CHECK:-unknown}"
            if test "${APK_CHECK:-}" = "success"; then
              echo "- **Modo:** HITO · APK disponible en los artefactos"
            else
              echo "- **Modo:** CI diaria · NO se ha generado APK"
            fi
            echo
            echo "## Errores recientes"
            if test -f reports/geometria.log; then
              echo "### Geometría"
              grep -Ei 'AssertionError|Exception in thread|error:|FAILURE:|FAILED' reports/geometria.log | tail -n 35 || true
            fi
            if test -f reports/gradle.log; then
              echo "### Android / Gradle"
              grep -Ei '(^| )error:|FAILURE:|What went wrong:|Execution failed|BUILD FAILED|[0-9]+ tests? failed' reports/gradle.log | tail -n 35 || true
            fi
            if test -f reports/apk-build.log; then
              echo "### Ensamblado APK (solo hito)"
              grep -Ei '(^| )error:|FAILURE:|What went wrong:|Execution failed|BUILD FAILED' reports/apk-build.log | tail -n 35 || true
            fi
            echo
            echo "Consulta reports/gradle.log para el detalle completo."
          } > reports/INFORME.md
          cat reports/INFORME.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar informe incluso si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-mycad-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar resultados Android y Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-android-mycad-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 30
      - name: Publicar APK solo tras superar verificaciones
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: myCad${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error

  publish-status:
    name: Publicar estado consultable
    needs: [verify]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: mycad-ci-status
      cancel-in-progress: false
    steps:
      - name: Descargar informe anterior
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: informe-mycad-${{ github.run_number }}
          path: reports
      - name: Escribir estado en rama separada
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.verify.result }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN: ${{ github.run_number }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAINTENANCE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          STATUS="$BUILD_RESULT"
          mkdir -p /tmp/mycad-status
          cd /tmp/mycad-status
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          if git fetch -q origin refs/heads/ci-status:refs/remotes/origin/ci-status; then
            git checkout -q -B ci-status refs/remotes/origin/ci-status
          else
            git checkout -q --orphan ci-status
          fi
          mkdir -p history
          cat > ESTADO_COMPILACION.md <<EOF
          # Estado de compilación MyCAD

          - **Resultado:** ${STATUS}
          - **Número de ejecución:** ${SOURCE_RUN}
          - **Commit compilado:** ${SOURCE_SHA}
          - **Fecha UTC:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **Enlace:** https://github.com/${GH_REPO}/actions/runs/${SOURCE_RUN_ID}

          ## Comprobaciones
          EOF
          if test -s "$GITHUB_WORKSPACE/reports/INFORME.md"; then
            sed -n '/^- Integridad:/p; /^- Pruebas geométricas:/p; /^- Gradle \/ Lint \/ tests:/p; /^- Generación APK:/p; /^- Verificación APK:/p; /^- \*\*Modo:/p' "$GITHUB_WORKSPACE/reports/INFORME.md" >> ESTADO_COMPILACION.md
          else
            echo "Informe detallado no disponible; consultar el enlace de la ejecución." >> ESTADO_COMPILACION.md
          fi
          cp ESTADO_COMPILACION.md "history/run-${SOURCE_RUN}.md"
          git add ESTADO_COMPILACION.md history/
          if ! git diff --cached --quiet; then
            git commit -qm "ci-status: ejecución ${SOURCE_RUN} (${STATUS})"
            git push -q origin HEAD:refs/heads/ci-status
          fi
          echo "Estado publicado en rama ci-status" >> "$GITHUB_STEP_SUMMARY"
          # Retirar solo una rama experimental identificada y SOLO tras el squash
          # del PR de mantenimiento. Si se ha movido, nunca borrar trabajo nuevo.
          case "${MAINTENANCE_MESSAGE:-}" in
            "chore(maintenance): MyCAD 0.6.0 actualizar documentación y retirar rama experimental"*)
              obsolete="development/box-brep-check"
              expected="c6255b2e4083e1e57676373d293f63d807ea9941"
              found="$(git ls-remote origin "refs/heads/$obsolete" | cut -f1)"
              if test "$found" = "$expected"; then
                if git push -q origin --delete "$obsolete"; then
                  echo "Rama temporal \`$obsolete\` eliminada tras verificar SHA." >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::No se pudo eliminar la rama temporal: faltan permisos."
                  echo "Eliminar rama temporal manualmente desde Code → Branches." >> "$GITHUB_STEP_SUMMARY"
                fi
              elif test -z "$found"; then
                echo "Rama temporal ya eliminada." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::Se conserva $obsolete: ha cambiado su SHA, no es seguro eliminarla."
              fi
              ;;
          esac

